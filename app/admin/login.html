<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · Hiring Assistant</title>
  <style>
    :root{color-scheme:dark;--ink:#eef4ed;--muted:#8e9b91;--dim:#5d6b61;--bg:#0b110e;--panel:#111a14;--panel-2:#162119;--line:#25332a;--lime:#c7ef73;--lime-dark:#98bf4d;--red:#ee8179}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 85% 0,#1d3222 0,transparent 35%),var(--bg);color:var(--ink);font:14px/1.45 Manrope,system-ui,sans-serif}
    .card{width:min(380px,100%);border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:28px 26px}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
    .mark{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:var(--lime);color:#0b110e;font-weight:800;font-size:18px}
    .eyebrow{color:var(--dim);font:10px 'DM Mono',monospace;letter-spacing:.06em}
    h1{margin:0;font-size:20px}
    label{display:block;margin:14px 0 5px;color:var(--muted);font:10px 'DM Mono',monospace;text-transform:uppercase}
    input{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);color:var(--ink);padding:11px 12px;font:inherit}
    input:focus{outline:none;border-color:var(--lime-dark)}
    button{width:100%;margin-top:20px;border:0;border-radius:7px;padding:12px;background:var(--lime);color:#0b110e;font:inherit;font-weight:800;cursor:pointer}
    button:disabled{opacity:.5;cursor:wait}
    .error{min-height:18px;margin-top:14px;color:var(--red);font-size:12px}
    .hint{margin-top:18px;color:var(--dim);font-size:11px;text-align:center}
  </style>
</head>
<body>
  <form class="card" id="form" autocomplete="on">
    <div class="brand"><span class="mark">H</span><div><div class="eyebrow">HIMALAYAS / RECRUITING</div><h1>Control center</h1></div></div>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">Sign in</button>
    <p class="error" id="error" role="alert"></p>
    <p class="hint">Hiring Assistant · sign in to manage your profiles</p>
  </form>
  <script>
    const $ = (id) => document.getElementById(id);
    // Already signed in (or on the server itself): go straight to the dashboard.
    fetch('/api/health').then((response) => { if (response.ok) location.replace('/admin/'); }).catch(() => {});
    $('form').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('submit').disabled = true; $('error').textContent = '';
      try {
        const response = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: $('username').value.trim(), password: $('password').value})});
        if (response.ok) { location.replace('/admin/'); return; }
        let detail = 'Could not sign in.';
        try { detail = (await response.json()).detail || detail; } catch (error) { /* keep the default */ }
        $('error').textContent = detail; $('password').value = ''; $('password').focus();
      } catch (error) { $('error').textContent = 'Could not reach the server.'; }
      $('submit').disabled = false;
    });
  </script>
</body>
</html>
